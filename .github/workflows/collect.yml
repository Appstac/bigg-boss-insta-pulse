# Takes an Instagram snapshot every 30 minutes and publishes it to the `data` branch.
# The site reads that branch directly (see src/lib/data.ts), so no redeploy is needed.
# vercel.json disables deployments for `data`. GitHub may start scheduled runs a few
# minutes late when its runners are busy.
name: Instagram snapshot

on:
  schedule:
    # Every 30 minutes, off the top of the hour (GitHub is busiest at :00). A 15-minute schedule
    # led Meta to temporarily block the app on 30 Sep 2026, so keep this modest.
    - cron: "7,37 * * * *"
    # Eviction check from Wikipedia after the Sunday episode (ends ~10:30 PM IST) and a
    # follow-up on Monday morning in case the page is edited late. Times are UTC:
    #   17:15 UTC Sun = 10:45 PM IST, 18:15 UTC Sun = 11:45 PM IST, 03:30 UTC Mon = 9:00 AM IST
    - cron: "15 17 * * 0"
    - cron: "15 18 * * 0"
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write # to flag new housemates that need an Instagram handle

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      # Node 24 runs the TypeScript collector directly, so no npm install is needed.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Load current data from the data branch
        run: |
          mkdir -p live data/posts public/avatars
          if git fetch --depth=1 origin data 2>/dev/null; then
            echo "DATA_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
            git archive FETCH_HEAD | tar -x -C live
            cp live/*.json data/
            cp -r live/posts/. data/posts/ 2>/dev/null || true
            cp -r live/avatars/. public/avatars/ 2>/dev/null || true
          fi

      - name: Check roster for evictions and wildcards
        # During the 00, 06, 12 and 18 UTC hours (tolerates late starts) and on manual runs. A failure here
        # (source page down or redesigned) must not stop the collection.
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( 10#$(date -u +%H) % 6 )) -eq 0 ]; then
            node --no-warnings scripts/sync-roster.ts || echo "::warning::Roster check failed; roster unchanged"
          else
            echo "Roster check runs every 6 hours; skipped this run."
          fi

      - name: Check Wikipedia for evictions
        # Sunday night / Monday morning schedules above, and manual runs. Never blocks collection.
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event.schedule == '15 17 * * 0' ||
          github.event.schedule == '15 18 * * 0' ||
          github.event.schedule == '30 3 * * 1'
        run: node --no-warnings scripts/sync-wikipedia.ts || echo "::warning::Wikipedia eviction check failed; roster unchanged"

      - name: Collect
        run: node --no-warnings scripts/collect.ts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      # The data branch holds only the latest files as a single commit (history lives inside
      # snapshots.json), so it is force-pushed each run and the repo does not grow.
      - name: Publish to the data branch
        run: |
          rm -rf out && mkdir -p out/avatars
          cp data/contestants.json data/meta.json data/profiles.json data/snapshots.json data/intraday.json out/
          cp -r data/posts out/posts
          cp public/avatars/*.jpg out/avatars/ 2>/dev/null || true
          # Vercel reads vercel.json from the branch it is building, so the data branch needs its own
          # copy saying "never deploy" (the master copy is not seen when data is pushed).
          echo '{ "git": { "deploymentEnabled": false } }' > out/vercel.json
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "data: $(TZ=Asia/Kolkata date '+%F %H:%M') IST"
          # --force-with-lease: if /admin saved a roster change while this run was going, don't
          # overwrite it; the next run will pick it up.
          git push -q --force-with-lease=data:${DATA_SHA:-} "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      # Wikipedia lists a housemate we don't track: open one issue per name so someone adds their
      # Instagram handle in /admin (handles can't be confirmed automatically).
      - name: Flag new housemates
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s data/wiki-new-entrants.txt ] || exit 0
          while IFS= read -r who; do
            [ -n "$who" ] || continue
            title="New housemate on Wikipedia: $who"
            if gh issue list -R "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq 'length' | grep -qx 0; then
              gh issue create -R "${{ github.repository }}" --title "$title" --body "Wikipedia's housemate table lists **$who**, who isn't tracked on the site yet. Find their Instagram profile, confirm it's them (the bio usually mentions Bigg Boss Telugu 10), then add it at https://bbpulse-six.vercel.app/admin. Close this issue once added."
            fi
          done < data/wiki-new-entrants.txt
